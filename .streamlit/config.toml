[theme]
base = "light"
primaryColor = "#285c46"
backgroundColor = "#f6f5ef"
secondaryBackgroundColor = "#eeeee5"
textColor = "#243c31"
font = "sans serif"

[server]
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
